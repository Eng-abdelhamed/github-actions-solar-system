name: Deployment - Reusable Workflow

on:
 workflow_call:

jobs:
    deployDockerResue:
      name: Containerization
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write

        steps:
          - name: CheckOutRepo 
            uses: actions/checkout@v5

          - name: DockerHub Logging
            uses: docker/login-action@v4
            with:
              # Vars    => Rebository Variables
              # secrets => Rebository Secrets
              username: ${{vars.DOCKER_USERNAME}}
              password: ${{secrets.DOCKER_PASSWORD}}
        
          - name: GitHub Registry  Logging
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              # In The Github Context 
              # Github_Token => Generated by default from Github when workflow
              username: ${{github.repository_owner}}
              password: ${{secrets.GITHUB_TOKEN}}
        
          - name: Dokcer Push 
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              # Push in DockerHub and GHCR
              tags: |
                ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
                ghcr.io/eng-abdelhamed/solarsystem:${{github.sha}}
