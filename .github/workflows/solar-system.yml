name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: "superuser"
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
          MONGO_URI: "mongodb://localhost:27017/superData"
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
    

        - name: Caching NPM Dependency
          uses: actions/cache@v5
          with:
            path: node_modules
            key: ${{runner.os}}-node_modules-${{hashFiles('package-lock.json')}}
          
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: code coverage
        runs-on: ubuntu-latest
        container:
            image: node:20
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options: --name mongo
        env:
          MONGO_URI: "mongodb://mongo:27017/superData"
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        steps:
          - name: Checkout The Repository
            uses: actions/checkout@v4

          # - name: Setup NodeJS
          #   uses: actions/setup-node@v4
          #   with:
          #     node-version: 20

          - name: Caching NPM Dependency
            uses: actions/cache@v5
            with:
              path: node_modules
              key: ${{runner.os}}-node_modules-${{hashFiles('package-lock.json')}}
          
          - name: install dependency
            run: npm install
          
          - name: Codecoverage
            continue-on-error: true
            run:  npm run coverage

          - name: Uploading The Code coverage
            uses: actions/upload-artifact@v4
            if: always()
            with:
              name: Code-Coverage-Result
              path: coverage
              retention-days: 5
    

    docker:
        name: Docker Logining
        needs: [unit-testing, code-coverage]
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: CheckOutRepo 
            uses: actions/checkout@v5

          - name: DockerHub Logging
            uses: docker/login-action@v4
            with:
              username: ${{vars.DOCKER_USERNAME}}
              password: ${{secrets.DOCKER_PASSWORD}}
        
          - name: GHCR Logging
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{github.repository_owner}}
              password: ${{secrets.GITHUB_TOKEN}}
        
          - name: Dokcer Push 
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              tags: |
                ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
                ghcr.io/eng-abdelhamed/solarsystem:${{github.sha}}

    Dev-Deploy:
      runs-on: ubuntu-latest
      needs: docker
      steps:
        - name: Checkout The Repository
          uses: actions/checkout@v5

        - name: Install Kubectl
          uses: azure/setup-kubectl@v4
        - uses: azure/k8s-set-context@v5
          with:
           method: kubeconfig
           kubeconfig:  ${{ secrets.KUBECONFIG }}

           
        - name: Fetch Data
          run: kubectl get nodes