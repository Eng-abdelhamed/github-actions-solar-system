name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature/*'

env:
  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: "superuser"
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
  AWS_ACCESS_KEY: ${{secrets.AWS_ACCESS_KEY}}
  AWS_PASSWORD: ${{secrets.AWS_PASSWORD}}
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        # container Service , sidecar container that work with the same network
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017 #Port Mapping
        env:
          MONGO_URI: "mongodb://localhost:27017/superData"
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
  
        - name: Caching NPM Dependency
          uses: actions/cache@v5
          with:
            path: node_modules
            key: ${{runner.os}}-node_modules-${{hashFiles('package-lock.json')}} # Key must be unqiue
          
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          if: always() # upload even if there is error 
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: code coverage
        runs-on: ubuntu-latest
        # Container Service ==> SideCar Container
        # Jop container     ==> Run all the Steps inside the Container  
        # jop container
        container:
            image: node:20
        # Service Container
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options: --name mongo
        env:
          MONGO_URI: "mongodb://mongo:27017/superData"
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        steps:
          - name: Checkout The Repository
            uses: actions/checkout@v4

          # Becuase u run all the steps inside Jop Container no need for installation of NPM
          # - name: Setup NodeJS
          #   uses: actions/setup-node@v4
          #   with:
          #     node-version: 20

          - name: Caching NPM Dependency
            uses: actions/cache@v5
            with:
              path: node_modules
              key: ${{runner.os}}-node_modules-${{hashFiles('package-lock.json')}}
          
          - name: install dependency
            run: npm install
          
          - name: Codecoverage
            continue-on-error: true
            run:  npm run coverage

          - name: Uploading The Code coverage
            uses: actions/upload-artifact@v4
            if: always()
            with:
              name: Code-Coverage-Result
              path: coverage
              retention-days: 5
  
    ReportingJop:
      name: Report Accomplishment
      needs: [unit-testing,code-coverage]
      runs-on: ubuntu-latest
      continue-on-error: true
      steps: 
        - name: Download Mocha Testing
          uses: actions/download-artifact@v8
          with:
            name: Mocha-Test-Result

        - name: Download Code Covegrage Testing
          uses: actions/download-artifact@v8
          with:
            name: Code-Coverage-Result

        - name: Merge Files
          run: | 
            mkdir reports-${{github.sha}} 
            sudo mv test-results.xml  reports-${{github.sha}}/
            sudo mv cobertura-coverage.xml  reports-${{github.sha}}/
            ls -ltra reports-${{github.sha}}/
          
        - name: Upload To AWS
          run:
            aws s3 cp reports-${{github.sha}} s3://apolloos3back/Productions --recursive

    docker: 
      name: Containerization
      needs: [unit-testing,code-coverage]
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write
      steps:
        - name: CheckOutRepo 
          uses: actions/checkout@v5

        - name: DockerHub Logging
          uses: docker/login-action@v4
          with:
              # Vars    => Rebository Variables
              # secrets => Rebository Secrets
            username: ${{vars.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}
        
        - name: GitHub Registry  Logging
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
              # In The Github Context 
              # Github_Token => Generated by default from Github when workflow
            username: ${{github.repository_owner}}
            password: ${{secrets.GITHUB_TOKEN}}
        
        - name: Dokcer Push 
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
              # Push in DockerHub and GHCR
            tags: |
              ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
              ghcr.io/eng-abdelhamed/solarsystem:${{github.sha}}
 
    Dev-Deploy:
      runs-on: ubuntu-latest
      needs: docker

      environment:
        # Name of The environment in Github
        name: development
        url: https://${{ steps.Set-ingress-host-address.outputs.APP_INGRESS_HOST}}

      outputs:
        APP_INGRESS_URL: ${{ steps.Set-ingress-host-address.outputs.APP_INGRESS_HOST}}

      steps:
        - name: Checkout The Repository
          uses: actions/checkout@v5
          # Install k8s on the VM 
        - name: Install Kubectl
          uses: azure/setup-kubectl@v4

          # Set The Kubeconfig file To operate on the K8s Clusters
        - uses: azure/k8s-set-context@v5
          with:
           method: kubeconfig
          # I put it in The Development Environment Secrets
           kubeconfig:  ${{ secrets.KUBECONFIG }}

        - name: Testing Operation of The K8s Cluster
          run: kubectl get nodes

        - name: Get Nginx Ingress Controller ip
          run: |
           echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV
      
        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
           tokenPrefix: '_{_'
           tokenSuffix: '_}_'
           files: '["kubernetes/development/*.yaml"]'
          #  Get All these Env From Environment Variables
          env:
           NAMESPACE: ${{vars.NAMESPACE}}
           REPLICAS: ${{vars.REPLICAS}}
           IMAGE: ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
          #  Get it from $GITHUB_ENV => env.
           INGRESS_IP: ${{env.INGRESS_IP}}

        # Create of The Securet Refrence in K8s 
        - name: Create The Secret Ref
          run: | 
           kubectl -n ${{vars.NAMESPACE}} create secret generic mongo-db-creds \
           --from-literal=MONGO_URI=${{env.MONGO_URI}} \
           --from-literal=MONGO_USERNAME=${{env.MONGO_USERNAME}} \ 
           --from-literal=MONGO_PASSWORD=${{secrets.MONGO_PASSWORD}} \
           --save-config \
           --dry-run=client \
           -o yaml | kubectl apply -f -

        
        - name: Deploy to Dev Env
          run: |
            kubectl apply -f kubernetes/development
            sleep 20

        - name: Set Application Host URL
          id: Set-ingress-host-address
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n development get ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}")" 
         
    Dev-IntegrationTest:
          name: Dev Integration Testing
          runs-on: ubuntu-latest
          needs: Dev-Deploy
          steps:
            - name: Test URL output using Curl and JQ
              env:
                URL: ${{ needs.Dev-Deploy.outputs.APP_INGRESS_URL}}
              run: | 
                echo $URL
                echo "------------------------"
                curl https//${{env.URL}}/live -s -k | jq -r .status | grep -i live
    
    Prod-Deploy:
      # Must Deploy on Main Branch
      if: github.ref == 'ref/heads/main'
      name: Production Deploying 
      runs-on: ubuntu-latest
      needs: docker

      environment:
        name: production

      outputs:
        APP_INGRESS_URL: ${{ steps.Set-ingress-host-address.outputs.APP_INGRESS_HOST}}

      steps:
        - name: Checkout The Repository
          uses: actions/checkout@v5

        - name: Install Kubectl
          uses: azure/setup-kubectl@v4

        - uses: azure/k8s-set-context@v5
          with:
           method: kubeconfig
          #  Secrets in Production Environment
           kubeconfig:  ${{ secrets.KUBECONFIG }}

        - name: Get Nginx Ingress Controller ip
          run: |
           echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV
      
        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
           tokenPrefix: '_{_'
           tokenSuffix: '_}_'
           files: '["kubernetes/production/*.yaml"]'

          env:
           NAMESPACE: ${{vars.NAMESPACE}}
           REPLICAS: ${{vars.REPLICAS}}
           IMAGE: ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
           INGRESS_IP: ${{env.INGRESS_IP}}

        - name: Create The Secret Ref
          run: | 
           kubectl -n ${{vars.NAMESPACE}} create secret generic mongo-db-creds \
           --from-literal=MONGO_URI=${{env.MONGO_URI}} \
           --from-literal=MONGO_USERNAME=${{env.MONGO_USERNAME}} \ 
           --from-literal=MONGO_PASSWORD=${{secrets.MONGO_PASSWORD}} \
           --save-config \
           --dry-run=client \
           -o yaml | kubectl apply -f -


        - name: Deploy to Prod Env
          run: |
            kubectl apply -f kubernetes/production

        - name: Set Application Host URL
          id: Set-ingress-host-address
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n ${{vars.NAMESPACE}} get ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}")" 

    Prod-IntegrationTest:
      # Must be in Main Branch
        if: github.ref == 'refs/heads/main'
        name: Production Integration Testing
        runs-on: ubuntu-latest
        needs: Prod-Deploy
        steps:
          - name: Test URL output using Curl and JQ
            env:
              URL: ${{ needs.Prod-Deploy.outputs.APP_INGRESS_URL}}
            run: | 
              echo $URL
              echo "------------------------"
              curl https//${{env.URL}}/live -s -k | jq -r .status | grep -i live
    