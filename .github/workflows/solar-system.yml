name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature/*'

env:
  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: "superuser"
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
  AWS_ACCESS_KEY: ${{secrets.AWS_ACCESS_KEY}}
  AWS_PASSWORD: ${{secrets.AWS_PASSWORD}}
  AWS_REGION: "us-east-1"
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017 
        env:
          MONGO_URI: "mongodb://localhost:27017/superData"
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
  
        - name: Caching NPM and Install Dependecies
          uses: ./.github/custom-actions/npm-actions
          with:
            path-action: node_modules

        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: code coverage
        runs-on: ubuntu-latest
        # Container Service ==> SideCar Container
        # Jop container     ==> Run all the Steps inside the Container  
        # jop container
        # container:
        #     image: node:20
        # # Service Container
        # services:
        #   mongo-db:
        #     image: siddharth67/mongo-db:non-prod
        #     options: --name mongo
        # env:
        #   MONGO_URI: "mongodb://mongo:27017/superData"
        #   MONGO_USERNAME: non-prod-user
        #   MONGO_PASSWORD: non-prod-password

        steps:
          - name: Checkout The Repository
            uses: actions/checkout@v4

          # Becuase u run all the steps inside Jop Container no need for installation of NPM
          # - name: Setup NodeJS
          #   uses: actions/setup-node@v4
          #   with:
          #     node-version: 20

          - name: Caching NPM and Install Dependecies
            uses: ./.github/custom-actions/npm-actions
            with:
              path-action: node_modules
        
          - name: Codecoverage
            continue-on-error: true
            run:  npm run coverage

          - name: Uploading The Code coverage
            uses: actions/upload-artifact@v4
            if: always()
            with:
              name: Code-Coverage-Result
              path: coverage
              retention-days: 5
  

    ReportingJop:
      name: Report Accomplishment
      needs: [unit-testing,code-coverage]
      runs-on: ubuntu-latest
      continue-on-error: true
      steps: 
        - name: Download Mocha Testing
          uses: actions/download-artifact@v8
          with:
            name: Mocha-Test-Result

        - name: Download Code Covegrage Testing
          uses: actions/download-artifact@v8
          with:
            name: Code-Coverage-Result

        - name: Merge Files
          run: | 
            mkdir reports-${{github.sha}} 
            sudo mv test-results.xml  reports-${{github.sha}}/
            sudo mv cobertura-coverage.xml  reports-${{github.sha}}/
            ls -ltra reports-${{github.sha}}/
          
        - uses: osiegmar/s3-publisher-action@v3
          with:
            bucket: apolloos3back
            dir: reports-${{github.sha}}
          env:
            AWS_REGION: us-east-1
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PASSWORD }}

    docker: 
      name: Containerization
      needs: [unit-testing,code-coverage]
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write
      steps:
        - name: CheckOutRepo 
          uses: actions/checkout@v5

        - name: DockerHub Logging
          uses: docker/login-action@v4
          with:
            username: ${{vars.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}
        
        - name: GitHub Registry  Logging
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{github.repository_owner}}
            password: ${{secrets.GITHUB_TOKEN}}
        
        - name: Dokcer Push 
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
              ghcr.io/eng-abdelhamed/solarsystem:${{github.sha}}
 
    Dev-Deploy:
      name: Deployment
      runs-on: ubuntu-latest
      needs: docker
      environment:
        name: development
        url: https://${{ steps.Set-ingress-host-address.outputs.APP_INGRESS_HOST }}
      outputs:
        APP_INGRESS_URL: ${{ steps.Set-ingress-host-address.outputs.APP_INGRESS_HOST }}
      steps:
        - name: Checkout The Repository
          uses: actions/checkout@v5

        - name: Install Kubectl
          uses: azure/setup-kubectl@v4

        - name: AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
            aws-secret-access-key: ${{ secrets.AWS_PASSWORD }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Set Kubernetes Context
          uses: azure/k8s-set-context@v5
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBECONFIG }}

        - name: Testing Operation of The K8s Cluster
          run: kubectl get nodes

        - name: Get Nginx Ingress Controller IP
          run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get service ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV

        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ vars.DOCKER_USERNAME }}/solarsystem:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Create The Secret Ref
          env:
          MONGO_URI: ${{ env.MONGO_URI }}
          MONGO_USERNAME: ${{ env.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          run:  |
           kubectl -n development create secret generic mongo-db-creds \
             --from-literal=MONGO_URI="$MONGO_URI" \
             --from-literal=MONGO_USERNAME="$MONGO_USERNAME" \
             --from-literal=MONGO_PASSWORD="$MONGO_PASSWORD" \
             --save-config \
             --dry-run=client \
             -o yaml | kubectl apply -f -

        - name: Deploy to Dev Env
          run: |
           kubectl apply -f kubernetes/development
           sleep 20

        - name: Set Application Host URL
          id: Set-ingress-host-address
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n development get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> "$GITHUB_OUTPUT"
          
    Dev-IntegrationTest:
          name: Dev Integration Testing
          runs-on: ubuntu-latest
          needs: Dev-Deploy
          steps:
            - name: Test URL output using Curl and JQ
              env:
                URL: ${{ needs.Dev-Deploy.outputs.APP_INGRESS_URL}}
              run: | 
                echo $URL
                echo "------------------------"
                curl https//${{env.URL}}/live -s -k | jq -r .status | grep -i live
    
    Prod-Deploy:
      if: github.ref == 'ref/heads/main'
      name: Production Deploying 
      runs-on: ubuntu-latest
      needs: docker

      environment:
        name: production

      outputs:
        APP_INGRESS_URL: ${{ steps.Set-ingress-host-address.outputs.APP_INGRESS_HOST}}

      steps:
        - name: Checkout The Repository
          uses: actions/checkout@v5

        - name: Install Kubectl
          uses: azure/setup-kubectl@v4

        - uses: azure/k8s-set-context@v5
          with:
           method: kubeconfig
           kubeconfig:  ${{ secrets.KUBECONFIG }}

        - name: Get Nginx Ingress Controller ip
          run: |
           echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV
      
        - name: Replace Tokens
          uses: cschleiden/replace-tokens@v1
          with:
           tokenPrefix: '_{_'
           tokenSuffix: '_}_'
           files: '["kubernetes/production/*.yaml"]'

          env:
           NAMESPACE: ${{vars.NAMESPACE}}
           REPLICAS: ${{vars.REPLICAS}}
           IMAGE: ${{vars.DOCKER_USERNAME}}/solarsystem:${{github.sha}}
           INGRESS_IP: ${{env.INGRESS_IP}}

        - name: Create The Secret Ref
          run: | 
           kubectl -n ${{vars.NAMESPACE}} create secret generic mongo-db-creds \
           --from-literal=MONGO_URI=${{env.MONGO_URI}} \
           --from-literal=MONGO_USERNAME=${{env.MONGO_USERNAME}} \ 
           --from-literal=MONGO_PASSWORD=${{secrets.MONGO_PASSWORD}} \
           --save-config \
           --dry-run=client \
           -o yaml | kubectl apply -f -


        - name: Deploy to Prod Env
          run: |
            kubectl apply -f kubernetes/production

        - name: Set Application Host URL
          id: Set-ingress-host-address
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n ${{vars.NAMESPACE}} get ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}")" 

    Prod-IntegrationTest:
        if: github.ref == 'refs/heads/main'
        name: Production Integration Testing
        runs-on: ubuntu-latest
        needs: Prod-Deploy
        steps:
          - name: Test URL output using Curl and JQ
            env:
              URL: ${{ needs.Prod-Deploy.outputs.APP_INGRESS_URL}}
            run: | 
              echo $URL
              echo "------------------------"
              curl https//${{env.URL}}/live -s -k | jq -r .status | grep -i live
    